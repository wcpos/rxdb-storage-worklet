name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the full benchmark after mandatory conformance smoke (both platforms)
        type: boolean
        default: false
# Hosted iOS can exceed Maestro's benchmark scroll timeout. Keep smoke mandatory.
# Once this trigger is on the default branch, maintainers can opt in:
# gh workflow run ci.yml --ref <branch> -f benchmark=true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' -r typecheck
      - run: pnpm --workspace-concurrency=1 --filter './packages/**' -r test
      - run: pnpm --filter './packages/**' -r build
      - run: pnpm exec vitest run benchmarks --minWorkers=1 --maxWorkers=2

  conformance:
    runs-on: ubuntu-latest
    env:
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm typecheck
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm conformance

  ios-e2e:
    runs-on: macos-26
    env:
      # Expo SDK 57 requires Xcode 26.4+; macos-15 only provides up to 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Cold hosted XCTest startup can exceed Maestro's default two minutes.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Install pinned Maestro before provisioning premium
        run: |
          # cli-2.10.0 maestro.zip SHA-256, computed on 2026-09-05: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
          curl --fail -L https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          mkdir -p /tmp/maestro
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
          npx expo prebuild --platform ios --no-install
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: pods-${{ runner.os }}-xcode-26.6-${{ hashFiles('pnpm-lock.yaml', 'example/ios/Podfile.lock') }}
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example/ios
        run: pod install
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RxDBWorkletBench.xcworkspace -scheme RxDBWorkletBench -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/ios-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/xcodebuild.log
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          xcrun simctl boot 'iPhone 17'
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted /tmp/ios-build/Build/Products/Debug-iphonesimulator/RxDBWorkletBench.app
          npx expo start --dev-client > /tmp/metro.log 2>&1 &
          curl --fail --retry 60 --retry-connrefused --retry-delay 1 http://localhost:8081/status
          curl --fail --max-time 180 'http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&minify=false' -o /dev/null
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          maestro test .maestro/conformance-smoke.yaml --format junit --output /tmp/maestro/conformance.xml --debug-output /tmp/maestro/conformance
      - if: env.HAS_RXDB_PREMIUM == 'true' && inputs.benchmark
        working-directory: example
        run: |
          maestro test .maestro/benchmark.yaml --format junit --output /tmp/maestro/benchmark.xml --debug-output /tmp/maestro/benchmark
          node scripts/collect-results.mjs /tmp/metro.log ios
          cp ../benchmarks/ios.json /tmp/maestro/benchmark/ios.json
      - if: always() && env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          include-hidden-files: true
          path: |
            /tmp/maestro/
            /tmp/metro.log
            /tmp/xcodebuild.log

  android-e2e:
    runs-on: ubuntu-latest
    env:
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Install pinned Maestro before provisioning premium
        run: |
          # cli-2.10.0 maestro.zip SHA-256, computed on 2026-09-05: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
          curl --fail -L https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          mkdir -p /tmp/maestro
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | sed -e '/^accessToken: /d' -e '/access-tokens\/0x/d'
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
          npx expo prebuild --platform android --no-install
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Build Android simulator APK before starting the emulator
        working-directory: example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-35-google_apis-x86_64-pixel_6
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BENCH_DEVICE: pixel_6 API 35 x86_64 emulator
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/debug/app-debug.apk
            pnpm --dir example exec expo start --dev-client > /tmp/metro.log 2>&1 &
            adb reverse tcp:8081 tcp:8081
            curl --fail --retry 60 --retry-connrefused --retry-delay 1 http://localhost:8081/status
            curl --fail --max-time 180 'http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=android&dev=true&minify=false' -o /dev/null
            maestro test example/.maestro/conformance-smoke.yaml --format junit --output /tmp/maestro/conformance.xml --debug-output /tmp/maestro/conformance
            if [ "${{ inputs.benchmark }}" = "true" ]; then maestro test example/.maestro/benchmark.yaml --format junit --output /tmp/maestro/benchmark.xml --debug-output /tmp/maestro/benchmark && node example/scripts/collect-results.mjs /tmp/metro.log android && cp benchmarks/android.json /tmp/maestro/benchmark/android.json; fi
      - if: always() && env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          include-hidden-files: true
          path: |
            /tmp/maestro/
            /tmp/metro.log
