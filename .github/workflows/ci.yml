name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' -r typecheck
      - run: pnpm --workspace-concurrency=1 --filter './packages/**' -r test

  conformance:
    runs-on: ubuntu-latest
    env:
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm typecheck
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm conformance

  ios-e2e:
    runs-on: macos-15
    env:
      # ExpoModulesJSI requires Swift tools 6.2; the image defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
          npx expo prebuild --platform ios --no-install
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: pods-${{ runner.os }}-xcode-26.3-${{ hashFiles('pnpm-lock.yaml', 'example/ios/Podfile.lock') }}
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example/ios
        run: pod install
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: |
          mkdir -p /tmp/maestro
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RxDBWorkletBench.xcworkspace -scheme RxDBWorkletBench -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/ios-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/xcodebuild.log
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          xcrun simctl boot 'iPhone 16'
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted /tmp/ios-build/Build/Products/Debug-iphonesimulator/RxDBWorkletBench.app
          npx expo start --dev-client > /tmp/metro.log 2>&1 &
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        run: |
          maestro test .maestro/conformance-smoke.yaml --format junit --output /tmp/maestro/conformance.xml --debug-output /tmp/maestro/conformance
          maestro test .maestro/benchmark.yaml --format junit --output /tmp/maestro/benchmark.xml --debug-output /tmp/maestro/benchmark
          node scripts/collect-results.mjs /tmp/metro.log ios
      - if: always() && env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          path: |
            benchmarks/
            /tmp/maestro/
            /tmp/metro.log
            /tmp/xcodebuild.log

  android-e2e:
    runs-on: ubuntu-latest
    env:
      HAS_RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM != '' }}
    steps:
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_RXDB_PREMIUM == 'true'
        working-directory: example
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
        run: |
          set -o pipefail
          printf "RXDB_PREMIUM=%s\n" "$RXDB_PREMIUM" > "$GITHUB_WORKSPACE/.env"
          unset RXDB_PREMIUM
          node node_modules/rxdb-premium/scripts/postinstall.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          node node_modules/rxdb-premium/scripts/installer.js 2>&1 | grep -v -e "^accessToken: " -e "access-tokens/0x"
          test -d node_modules/rxdb-premium/dist/esm/plugins/storage-abstract-filesystem
          npx expo prebuild --platform android --no-install
          mkdir -p /tmp/maestro
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Build Android simulator APK before starting the emulator
        working-directory: example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2
      - if: env.HAS_RXDB_PREMIUM == 'true'
        name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-35-google_apis-x86_64-pixel_6
      - if: env.HAS_RXDB_PREMIUM == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/debug/app-debug.apk
            pnpm --dir example exec expo start --dev-client > /tmp/metro.log 2>&1 &
            adb reverse tcp:8081 tcp:8081
            maestro test example/.maestro/conformance-smoke.yaml --format junit --output /tmp/maestro/conformance.xml --debug-output /tmp/maestro/conformance
            maestro test example/.maestro/benchmark.yaml --format junit --output /tmp/maestro/benchmark.xml --debug-output /tmp/maestro/benchmark
            node example/scripts/collect-results.mjs /tmp/metro.log android
      - if: always() && env.HAS_RXDB_PREMIUM == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            benchmarks/
            /tmp/maestro/
            /tmp/metro.log
