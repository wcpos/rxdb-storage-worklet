appId: com.wcpos.rxdbstorageworklet
---
- launchApp
# The button is on the first screen; wait for the bundle to render rather than scrolling for it.
# scrollUntilVisible at 100% visibility misjudged a fully visible card on a hosted simulator (run 33973533826).
- extendedWaitUntil:
    visible:
      id: conformance-open
    timeout: 120000
- tapOn:
    id: conformance-open
- extendedWaitUntil:
    visible:
      id: conformance-summary
      text: "8 scenarios · ALL PASS"
    timeout: 600000
